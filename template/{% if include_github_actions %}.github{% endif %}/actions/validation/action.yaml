name: Validation
description: Validate the committed dependency versions and source without fixing files.
runs:
  using: composite
  steps:
    - name: Install the project toolchain
      uses: astral-sh/setup-uv@v7
      with:
        version-file: uv.toml
        python-version: ${{ env.PY_VERSION }}

    - name: Install dependencies
      run: uv sync --locked
      shell: bash

    - name: Validate
      run: uv run --locked poe validate
      shell: bash
