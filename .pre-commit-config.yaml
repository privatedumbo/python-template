exclude: ^template/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-json
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff fixes
        language: system
        entry: uv run --locked ruff check --fix --force-exclude
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        language: system
        entry: uv run --locked ruff format --force-exclude
        types_or: [python, pyi]
      - id: mypy
        name: Mypy
        language: system
        entry: uv run --locked mypy tests
        pass_filenames: false
        files: '(^|/)(pyproject\.toml|uv\.lock|uv\.toml)$|\.pyi?$'
