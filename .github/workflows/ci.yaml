name: CI - Template Validation

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version-file: uv.toml
          python-version: "3.13"
      - name: Install locked template dependencies
        run: uv sync --locked
      # These tests generate and validate projects on 3.13, 3.14, and 3.15.
      - name: Validate template and generated projects
        run: uv run --locked poe validate

  test-generated-options:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include_docker: [true, false]
        include_github_actions: [true, false]
        include_postgres: [true, false]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version-file: uv.toml
          python-version: "3.14"
      - run: uv sync --locked
      - name: Generate the current template
        run: |
          uv run --locked copier copy . /tmp/generated-project \
            --vcs-ref=HEAD --defaults --trust \
            --data project_slug=generated_test_project \
            --data author_name=CI \
            --data author_email=ci@example.com \
            --data github_username=example \
            --data "include_docker=${{ matrix.include_docker }}" \
            --data "include_github_actions=${{ matrix.include_github_actions }}" \
            --data "include_postgres=${{ matrix.include_postgres }}"
      # A new project needs its own lock; all later checks must preserve it.
      - name: Bootstrap generated lockfile
        working-directory: /tmp/generated-project
        run: uv lock
      - name: Validate generated project
        working-directory: /tmp/generated-project
        run: |
          uv sync --locked
          uv run --locked poe validate

  test-docker:
    runs-on: ubuntu-latest
    env:
      RUN_DOCKER_TESTS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version-file: uv.toml
          python-version: "3.14"
      - run: uv sync --locked
      - name: Build and run generated images
        run: uv run --locked pytest -m docker -v
