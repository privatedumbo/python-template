[project]
name = "python-copier-template"
version = "0.0.1"
description = "A Copier template for Python projects with UV, Ruff, Mypy, and Pytest."
readme = "README.md"
license = { text = "MIT" }
authors = [ { name = "Franco Bocci", email = "francogbocci@gmail.com" } ]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "copier==9.19.1",
    "mypy==2.4.0",
    "poethepoet==0.49.0",
    "prek==0.5.5",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
    "uv==0.13.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
strict = true
addopts = "--import-mode=importlib"
markers = ["docker: builds and runs generated images (requires Docker)"]

[tool.ruff]
target-version = "py312"
output-format = "full"
line-length = 88
# Exclude template directory from linting (it contains Jinja templates)
exclude = ["template"]

[tool.ruff.lint]
# Annotation requirements are enforced by strict mypy.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PT", "PTH", "S", "ARG"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ARG",      # "Unused function argument". Fixtures are often unused.
    "S101",     # "Use of `assert` detected"
    "S106",     # "Possible hardcoded password"
    "S603",     # `subprocess` call - safe in tests
    "S607",     # Starting a process with a partial executable path - safe in tests
    "PT004",    # Does not return anything, add leading underscore
    "PLR2004",  # Magic value used in comparison
]

[tool.mypy]
strict = true
namespace_packages = true
explicit_package_bases = true
plugins = []
exclude = ["template"]

[tool.poe]
include = "scripts/app.toml"
